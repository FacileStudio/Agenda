# The Go family's coding standard, enforced by filet: the suite's `facile` preset
# plus what this repository's layout demands. https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      the rules, against the committed baseline
#
# A preset's lists are replaced, not merged, so requiredFiles restates the
# preset's glob before adding the exception.

preset: facile

kind: app

architecture:
  requiredFiles:
    "apps/api/modules/*": [router.go]
    "apps/api/modules/caldav": []  # caldav registers its routes from handler.go

# filet gate's gofmt step runs `gofmt -l .` over vendor/ as well, and the vendored
# upstream sources are not gofmt-clean. scripts/check.sh, the first pre-push job,
# runs gofmt with vendor/ excluded, so the gate skips only that step.
gate:
  disable: [gofmt]
