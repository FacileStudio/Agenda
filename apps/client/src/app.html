<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the stored choice before first paint, as @facile/client's theme store does
			// after hydration: `.dark` or `.light` for an explicit choice, neither for system,
			// which muse paints from `prefers-color-scheme` scoped to `:root:not(.light)`.
			(function () {
				try {
					var stored = localStorage.getItem('agenda.theme');
					document.documentElement.classList.toggle('dark', stored === 'dark');
					document.documentElement.classList.toggle('light', stored === 'light');
				} catch (e) {}
			})();
		</script>

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Agenda" />
		<meta property="og:url" content="https://agenda.facile.studio/" />
		<meta property="og:title" content="Agenda — Calendrier auto-hébergé" />
		<meta
			property="og:description"
			content="Calendrier auto-hébergé pour studios créatifs et indépendants. Agendas personnels et partagés, avec une vraie synchro CalDAV."
		/>
		<meta property="og:image" content="https://agenda.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Agenda — Calendrier auto-hébergé" />
		<meta
			name="twitter:description"
			content="Calendrier auto-hébergé pour studios créatifs et indépendants. Agendas personnels et partagés, avec une vraie synchro CalDAV."
		/>
		<meta name="twitter:image" content="https://agenda.facile.studio/og-image.png" />
		%sveltekit.head%

		<title>Agenda — Calendrier auto-hébergé</title>
		<meta
			name="description"
			content="Calendrier auto-hébergé pour studios créatifs et indépendants. Agendas personnels et partagés, avec une vraie synchro CalDAV."
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
