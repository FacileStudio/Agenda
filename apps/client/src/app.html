<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the stored choice before first paint, as @facile/client's theme store does
			// after hydration: `.dark` or `.light` for an explicit choice, neither for system,
			// which muse paints from `prefers-color-scheme` scoped to `:root:not(.light)`.
			(function () {
				try {
					var stored = localStorage.getItem('agenda.theme');
					document.documentElement.classList.toggle('dark', stored === 'dark');
					document.documentElement.classList.toggle('light', stored === 'light');
				} catch (e) {}
			})();
		</script>
		<script>
			(function () {
				if (location.hostname !== 'agenda.facile.studio') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>

		<title>Agenda · The shared studio calendar</title>
		<meta name="description" content="Appointments, deadlines and team availability in one calendar. Native CalDAV, no Google account needed." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://agenda.facile.studio/" />
		<meta property="og:title" content="Agenda · The shared studio calendar" />
		<meta property="og:description" content="Appointments, deadlines and team availability in one calendar. Native CalDAV, no Google account needed." />
		<meta property="og:image" content="https://agenda.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Agenda: The shared studio calendar" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Agenda · The shared studio calendar" />
		<meta name="twitter:description" content="Appointments, deadlines and team availability in one calendar. Native CalDAV, no Google account needed." />
		<meta name="twitter:image" content="https://agenda.facile.studio/og-image.png" />

		<meta name="color-scheme" content="light dark" />

		%sveltekit.head%

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
