services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  agenda:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/agenda?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - agenda_data:/app/data

volumes:
  postgres_data:
  agenda_data:
