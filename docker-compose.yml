services:
  db:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: ${DB_NAME:-agenda}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  agenda:
    build: .
    network_mode: host
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - agenda_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.agenda.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.agenda.entrypoints=websecure
      - traefik.http.routers.agenda.tls.certresolver=letsencrypt
      - traefik.http.services.agenda.loadbalancer.server.port=4000

volumes:
  postgres_data:
  agenda_data:
